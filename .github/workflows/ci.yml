name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @vdb/web

  go-test:
    name: go-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fablazing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/fablazing/go.mod
          cache-dependency-path: services/fablazing/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  sam-validate:
    name: sam-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fablazing
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam validate --lint --region eu-west-1
      - run: sam validate --lint --region eu-west-1 -t infra/bootstrap.yaml
      - run: sam validate --lint --region eu-west-1 -t infra/maintainer.yaml

  db-test:
    name: db-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase db start
      - run: supabase test db
      - run: npm run test:integration -w @vdb/importer
