# Netlify: builds the web app (a Vite single-page app) from the repo root.
# VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are set in Netlify's UI (Site configuration →
# Environment variables): the anon key is public by design; row level security guards the data.

[build]
  command = "npm run build -w @vdb/web"
  publish = "apps/web/dist"

[build.environment]
  # The same Node as CI; Vite 8 needs a recent one.
  NODE_VERSION = "24"

# The router runs in the browser: every path loads the app, so deep links and refreshes work.
# Files that exist (the built assets) are served first; Netlify only applies this otherwise.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built assets have content hashes in their names, so they can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Only what the app loads (security audit, 16 Oct 2026): itself, the Supabase project,
    # Google Fonts, and the card images. data: is for the small inline icons in the CSS.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; connect-src 'self' https://gmqdtqgkqygepsbrgomk.supabase.co wss://gmqdtqgkqygepsbrgomk.supabase.co; img-src 'self' data: https://legendstory-production-s3-public.s3.amazonaws.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
