AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  vdb-fablazing-bootstrap: what GitHub Actions needs to deploy the vdb-fablazing
  stack, and nothing more. The maintainer deploys this by hand, once and after
  any change to it (see services/fablazing/README.md). GitHub can't change it.

Parameters:
  AlarmEmail:
    Type: String
    Description: Where the ingest's error alarm is emailed. Confirm the subscription from the inbox.
  GitHubRepo:
    Type: String
    Default: esweby/vdb_fe
  CreateOIDCProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: "false if the account already has GitHub's OIDC provider (there can be only one)."

Conditions:
  MakeOIDCProvider: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub vdb-fablazing-artifacts-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-builds
            Status: Enabled
            ExpirationInDays: 14
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub ${ArtifactsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: vdb-fablazing-alarms

  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # The most any role in the vdb-fablazing stack can ever do, whatever its own
  # policy says. The CloudFormation role can only create roles that carry it.
  Boundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: vdb-fablazing-boundary
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vdb-fablazing-*
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
            Resource:
              - !Sub arn:aws:s3:::vdb-fablazing-raw-${AWS::AccountId}
              - !Sub arn:aws:s3:::vdb-fablazing-raw-${AWS::AccountId}/*
          - Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/vdb/fablazing/*
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:vdb-fablazing-*

  # CloudFormation acts as this role when it deploys the vdb-fablazing stack.
  # It can manage only that stack's resources, named vdb-fablazing-*.
  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vdb-fablazing-cfn-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: vdb-fablazing-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudFormation expands template.yaml's SAM transform as this role.
              - Sid: SamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: RawBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:ListBucket
                  - s3:GetBucket*
                  - s3:PutBucket*
                  - s3:DeleteBucketPolicy
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:PutLifecycleConfiguration
                Resource: !Sub arn:aws:s3:::vdb-fablazing-raw-${AWS::AccountId}
              - Sid: ReadBuiltCode
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${ArtifactsBucket.Arn}/*
              - Sid: Function
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:vdb-fablazing-*
              - Sid: CreateBoundedRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:PutRolePolicy
                  - iam:PutRolePermissionsBoundary
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/vdb-fablazing-app/*
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref Boundary
              - Sid: ManageAppRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/vdb-fablazing-app/*
              - Sid: PassAppRoles
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/vdb-fablazing-app/*
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - lambda.amazonaws.com
                      - scheduler.amazonaws.com
              - Sid: Schedule
                Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:GetSchedule
                  - scheduler:TagResource
                  - scheduler:UntagResource
                  - scheduler:ListTagsForResource
                Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/vdb-fablazing-*
              - Sid: LogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vdb-fablazing-*
              - Sid: Alarm
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                  - cloudwatch:ListTagsForResource
                Resource: !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:vdb-fablazing-*
              - Sid: Describe
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - cloudwatch:DescribeAlarms
                Resource: "*"

  # GitHub Actions assumes this role on pushes to main. It can update the
  # vdb-fablazing stack only through CloudFormationRole.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vdb-fablazing-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy-vdb-fablazing
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ChangeSetsThroughTheCloudFormationRole
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/vdb-fablazing/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
                Condition:
                  StringEquals:
                    cloudformation:RoleArn: !GetAtt CloudFormationRole.Arn
              - Sid: Stack
                Effect: Allow
                Action:
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/vdb-fablazing/*
              - Sid: Templates
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: UploadBuilds
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub ${ArtifactsBucket.Arn}/*
              - Sid: PassTheCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

Outputs:
  DeployRoleArn:
    Description: Set as the GitHub Actions variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  CloudFormationRoleArn:
    Value: !GetAtt CloudFormationRole.Arn
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  AlarmTopicArn:
    Value: !Ref AlarmTopic
